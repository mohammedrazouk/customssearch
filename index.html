<html lang="ar" dir="rtl">
<head>

    <style>
        /* تعديل مهم: جعل الصفحة تأخذ كامل ارتفاع الشاشة وتوزيع العناصر */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column; /* ترتيب العناصر عمودياً */
        }

        .container {
            max-width: 1400px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex: 1; /* يسمح للحاوية بالتمدد لملء المساحة المتبقية */
            width: 95%;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .search-boxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        .input-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #34495e;
        }
        .input-group input {
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
            background-color: #fff;
        }
        .input-group input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }
        
        /* تنسيق صف البحث العام وزر المسح */
        .general-search-row {
            grid-column: 1 / -1; 
            display: flex;
            gap: 10px;
            background-color: #e8f4f8;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #bce8f1;
            align-items: flex-end;
        }
        .general-search-row .input-group {
            flex-grow: 1;
        }
        .general-search-row input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #3498db;
        }
        
        /* زر مسح البحث */
        .btn-clear {
            padding: 12px 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            height: 47px;
        }
        .btn-clear:hover {
            background-color: #c0392b;
        }
        .btn-clear:active {
            transform: scale(0.98);
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            border-left: 1px solid #ddd;
        }
        th {
            background-color: #2c3e50;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .no-results {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            font-weight: bold;
            display: none;
            font-size: 18px;
        }
        
        /* تنسيق شريط التمرير */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        .footer {
            background-color: #2c3e50;
            color: #ecf0f1;

            margin-top: auto; /* يدفع الفوتر دائماً للأسفل */
        }
        
        .footer span {
            color: #f1c40f; /* لون ذهبي للاسم */
            margin: 0 5px;
        }

</head>

    const tableBody = document.getElementById('tableBody');
    const noResults = document.getElementById('noResults');

    function renderTable(dataToRender) {
        tableBody.innerHTML = '';
        if (dataToRender.length === 0) {
            noResults.style.display = 'block';
        } else {
            noResults.style.display = 'none';
            dataToRender.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell;
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            });
        }
    }

    function filterData() {
        const mainSearch = document.getElementById('searchMain').value.trim().toLowerCase();
        const subSearch = document.getElementById('searchSub').value.trim().toLowerCase();
        const typeSearch = document.getElementById('searchType').value.trim().toLowerCase();
        const tradeSearch = document.getElementById('searchTrade').value.trim().toLowerCase();
        const generalSearch = document.getElementById('searchGeneral').value.trim().toLowerCase();

        const filteredData = data.filter(row => {
            const matchesMain = row[1].toLowerCase().includes(mainSearch);
            const matchesSub = row[2].toLowerCase().includes(subSearch);
            const matchesType = row[4].toLowerCase().includes(typeSearch);
            const matchesTrade = row[5].toLowerCase().includes(tradeSearch);

            let matchesGeneral = true;
            if (generalSearch !== "") {
                matchesGeneral = row.some(cell => cell.toLowerCase().includes(generalSearch));
            }

            return matchesMain && matchesSub && matchesType && matchesTrade && matchesGeneral;
        });

        renderTable(filteredData);
    }

    function clearSearch() {
        document.getElementById('searchMain').value = '';
        document.getElementById('searchSub').value = '';
        document.getElementById('searchType').value = '';
        document.getElementById('searchTrade').value = '';
        document.getElementById('searchGeneral').value = '';
        
        renderTable(data);
        document.getElementById('searchGeneral').focus();
    }

    function populateDatalists() {
        const uniqueMain = [...new Set(data.map(row => row[1]))].sort();
        const uniqueSub = [...new Set(data.map(row => row[2]))].sort();
        const uniqueType = [...new Set(data.map(row => row[4]))].sort();
        const uniqueTrade = [...new Set(data.map(row => row[5]))].sort();

        const fillList = (listId, items) => {
            const listElement = document.getElementById(listId);
            listElement.innerHTML = ''; 
            items.forEach(item => {
                if(item) { 
                    const option = document.createElement('option');
                    option.value = item;
                    listElement.appendChild(option);
                }
            });
        };

        fillList('listMain', uniqueMain);
        fillList('listSub', uniqueSub);
        fillList('listType', uniqueType);
        fillList('listTrade', uniqueTrade);
    }

    document.getElementById('searchMain').addEventListener('input', filterData);
    document.getElementById('searchSub').addEventListener('input', filterData);
    document.getElementById('searchType').addEventListener('input', filterData);
    document.getElementById('searchTrade').addEventListener('input', filterData);
    document.getElementById('searchGeneral').addEventListener('input', filterData);

    renderTable(data);
    populateDatalists();

</script>
